name: Build macOS App (Intel)

on:
  workflow_dispatch: 

jobs:
  build-macos-intel:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller Move-It.spec --clean --noconfirm

    - name: Diagnostic Test
      run: |
        echo "Checking supported CPU architectures (Intel/M-series)..."
        lipo -info dist/Move-It.app/Contents/MacOS/Move-It
        
        echo "Checking executable permissions..."
        ls -la dist/Move-It.app/Contents/MacOS/Move-It
        
        echo "Forcing executable permissions..."
        chmod +x dist/Move-It.app/Contents/MacOS/Move-It
        
        echo "Running app to check for startup errors..."
        # Run in background, wait 10 seconds, then kill
        dist/Move-It.app/Contents/MacOS/Move-It > app_startup.log 2>&1 &
        APP_PID=$!
        sleep 10
        
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App is still running successfully! (No instant crash)"
          kill $APP_PID
        else
          echo "APP CRASHED ON STARTUP! Here is the error log:"
          cat app_startup.log
          exit 1
        fi
        
        echo "Startup log output (if any):"
        cat app_startup.log

    - name: Import Apple Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: "temp_runner_password"
      run: |
        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        
        # Disable keychain auto-lock (prevents lock during long notarization)
        security set-keychain-settings build.keychain
        
        # Import certificate from secrets
        echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r ' | base64 --decode -o certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

    - name: Code Sign App
      run: |
        # Apple requires entitlements for hardened runtime
        cat << 'EOF' > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.device.camera</key>
            <true/>
            <key>com.apple.security.device.microphone</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # Get the actual certificate identity name automatically
        CERT_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | sed -n 's/.*"\(.*\)".*/\1/p')
        
        echo "Found identity: $CERT_IDENTITY"
        
        # Sign all Mach-O binaries (catches .so, .dylib, .bundle, and raw executables inside MediaPipe)
        find dist/Move-It.app -type f | while read -r file; do
          if file "$file" | grep -q "Mach-O"; then
            codesign --force --sign "$CERT_IDENTITY" --options runtime --entitlements entitlements.plist "$file" || true
          fi
        done
        
        # Sign the main app bundle
        codesign --deep --force --sign "$CERT_IDENTITY" --options runtime --entitlements entitlements.plist dist/Move-It.app
        
        # Verify
        codesign -dv --verbose=4 dist/Move-It.app

    - name: Create DMG
      run: |
        mkdir -p dist/dmg
        ditto dist/Move-It.app dist/dmg/Move-It.app
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname "Move-It" -srcfolder dist/dmg -ov -format UDZO dist/Move-It-macOS.dmg

    - name: Code Sign DMG
      run: |
        CERT_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | sed -n 's/.*"\(.*\)".*/\1/p')
        codesign --force --sign "$CERT_IDENTITY" dist/Move-It-macOS.dmg

    - name: Verify DMG App
      run: |
        echo "Mounting final DMG..."
        hdiutil attach dist/Move-It-macOS.dmg
        
        echo "Verifying code signature inside DMG..."
        codesign --verify --deep --verbose /Volumes/Move-It/Move-It.app
        
        echo "Running app from mounted DMG..."
        /Volumes/Move-It/Move-It.app/Contents/MacOS/Move-It > dmg_startup.log 2>&1 &
        APP_PID=$!
        sleep 10
        
        if kill -0 $APP_PID 2>/dev/null; then
          echo "App inside DMG is running successfully!"
          kill $APP_PID
        else
          echo "App inside DMG crashed! Log:"
          cat dmg_startup.log
          hdiutil detach /Volumes/Move-It
          exit 1
        fi
        
        echo "Detaching DMG..."
        hdiutil detach /Volumes/Move-It

    - name: Notarize DMG
      if: false
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      run: |
        # Store credentials securely for notarytool
        xcrun notarytool store-credentials "notary-creds" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
        
        # Submit for notarization (capture the submission ID)
        SUBMIT_OUTPUT=$(xcrun notarytool submit dist/Move-It-macOS.dmg --keychain-profile "notary-creds" 2>&1)
        echo "$SUBMIT_OUTPUT"
        SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
        echo "Submission ID: $SUBMISSION_ID"
        
        # Wait for notarization with retry logic (handles network drops and keychain locks)
        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Attempt $i of $MAX_RETRIES to check notarization status..."
          # Re-unlock keychain before each attempt (prevents auto-lock timeout)
          security unlock-keychain -p "temp_runner_password" build.keychain
          if xcrun notarytool wait "$SUBMISSION_ID" --keychain-profile "notary-creds" --timeout 30m 2>&1; then
            echo "Notarization check completed!"
            break
          else
            echo "Attempt $i failed. Waiting 30 seconds before retry..."
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "All retries exhausted. Checking final status..."
              security unlock-keychain -p "temp_runner_password" build.keychain
              xcrun notarytool info "$SUBMISSION_ID" --keychain-profile "notary-creds"
              exit 1
            fi
            sleep 30
          fi
        done
        
        # Verify the notarization was accepted
        security unlock-keychain -p "temp_runner_password" build.keychain
        STATUS=$(xcrun notarytool info "$SUBMISSION_ID" --keychain-profile "notary-creds" 2>&1)
        echo "$STATUS"
        if echo "$STATUS" | grep -q "status: Accepted"; then
          echo "Notarization succeeded!"
        else
          echo "Notarization failed. Fetching log..."
          xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notary-creds"
          exit 1
        fi

    - name: Staple Ticket to DMG
      if: false
      run: |
        xcrun stapler staple dist/Move-It-macOS.dmg
        
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Move-It-macOS-Intel-Build
        path: dist/Move-It-macOS.dmg
