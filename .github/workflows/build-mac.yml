name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller Move-It.spec --clean --noconfirm

    - name: Import Apple Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: "temp_runner_password"
      run: |
        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        
        # Import certificate from secrets
        echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n\r ' | base64 --decode -o certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

    - name: Code Sign App
      run: |
        # Apple requires entitlements for hardened runtime
        cat << 'EOF' > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.device.camera</key>
            <true/>
            <key>com.apple.security.device.microphone</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # Get the actual certificate identity name automatically
        CERT_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | sed -n 's/.*"\(.*\)".*/\1/p')
        
        echo "Found identity: $CERT_IDENTITY"
        
        # Sign all libraries
        find dist/Move-It.app -type f \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign "$CERT_IDENTITY" --options runtime --entitlements entitlements.plist {} \;
        
        # Sign the main app bundle
        codesign --deep --force --sign "$CERT_IDENTITY" --options runtime --entitlements entitlements.plist dist/Move-It.app
        
        # Verify
        codesign -dv --verbose=4 dist/Move-It.app

    - name: Create DMG
      run: |
        mkdir -p dist/dmg
        cp -R dist/Move-It.app dist/dmg/
        ln -s /Applications dist/dmg/Applications
        hdiutil create -volname "Move-It" -srcfolder dist/dmg -ov -format UDZO dist/Move-It-macOS.dmg

    - name: Code Sign DMG
      run: |
        CERT_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | sed -n 's/.*"\(.*\)".*/\1/p')
        codesign --force --sign "$CERT_IDENTITY" dist/Move-It-macOS.dmg

    - name: Notarize DMG
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      run: |
        # Store credentials securely for notarytool
        xcrun notarytool store-credentials "notary-creds" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
        
        # Submit for notarization and wait for the result
        xcrun notarytool submit dist/Move-It-macOS.dmg --keychain-profile "notary-creds" --wait

    - name: Staple Ticket to DMG
      run: |
        xcrun stapler staple dist/Move-It-macOS.dmg
        
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Move-It-macOS-Build
        path: dist/Move-It-macOS.dmg
